<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A private browser-based video recorder. Your recordings stay on your device.">
  <title>Private Video Recorder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <header>
      <h1>🎥 Private Video Recorder</h1>
      <p>Your recordings stay on your device.</p>
    </header>

    <section class="recorder">
      <video id="preview" autoplay muted playsinline></video>

      <div id="status" class="status">
        Camera not started
      </div>

      <div id="timer" class="timer">
        00:00
      </div>

      <div class="controls">
        <button id="startCamera">Start Camera</button>
        <button id="startRecording" disabled>● Record</button>
        <button id="stopRecording" disabled>■ Stop</button>
      </div>
    </section>

    <section id="result" class="result hidden">
      <h2>Your Recording</h2>

      <video id="recording" controls playsinline></video>

      <a id="download" class="download">
        💾 Save Video
      </a>
    </section>

    <section class="privacy">
      <h2>🔒 Privacy</h2>
      <p>
        This recorder does not have a server or upload system.
        Video recording happens directly in your browser.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
